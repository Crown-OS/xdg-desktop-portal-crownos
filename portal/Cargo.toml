[package]
name = "xdg-desktop-portal-crownos"
description = "xdg-desktop-portal backend for CrownOS: screen casting over crownos-screencast-v1 and PipeWire"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crownos-protocols = { path = "../../crownos-protocols", features = ["client"] }
gbm = { version = "0.18.0", default-features = false }
serde = "1.0"
pipewire = { version = "0.10.1", features = ["v0_3_34"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "macros", "process", "sync", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
