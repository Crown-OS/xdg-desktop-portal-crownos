[package]
name = "crownos-portal-dialog"
description = "The alert xdg-desktop-portal-crownos asks the user with"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crownos-config = { path = "../../crownos-config", default-features = false }
rustix = { version = "1", default-features = false, features = ["process", "std"] }
crownui = { path = "../../crownui/crownui", default-features = false, features = [
  "wayland",
  "impeller",
  "static",
  "accessibility",
] }

[dev-dependencies]
crowntest = { path = "../../crownui/crowntest" }
